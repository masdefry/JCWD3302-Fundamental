<script>
  class Products {
    name = '';
    price = 0;
    stock = 0;

    constructor(_name, _price, _stock) {
      this.name = _name;
      this.price = _price;
      this.stock = _stock;
    }
  }

  const products = [
    new Products('Apel', 15000, 15),
    new Products('Jeruk', 20000, 20),
    new Products('Anggur', 25000, 25),
  ];
  // Step-01: Tampilkan list product didalam sebuah prompt
  //          > Input nomor product harus sesuai dengan yang ada di list
  // 1. Apel
  // 2. Jeruk
  // 3. Anggur
  let printProduct = '';

  products.forEach((product, index) => {
    printProduct += `${index + 1}. ${
      product.name
    }: Rp.${product.price.toLocaleString('id-ID')} (Stock: ${
      product.stock
    }) \n`;
  });

  const numberOfProduct = prompt(printProduct);
  //   Tidak boleh input < 1 || Tidak boleh input > jumlah produk
  if (numberOfProduct < 1 || numberOfProduct > products.length) {
    alert('Product Not Found!');
  }

  // Step-02: Tampilkan prompt input qty
  //          > Input qty tidak boleh melebihi stock
  do {
    var qty = prompt('Input Qty');
    var selectedProduct = products[numberOfProduct - 1];

    if (qty > selectedProduct.stock) {
      alert('Insufficient Stock!');
    }
  } while (qty > selectedProduct.stock);

  // Step-03: Tampilkan informasi pembelian
  //          > Menjumlahkan qty dikalikan dengan price
  alert(`
    Product Name: ${selectedProduct.name} \n
    Product Price: ${selectedProduct.price} \n
    Product Qty: ${qty} \n
    Total: ${selectedProduct.price * qty}
  `);
</script>
